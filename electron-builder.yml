appId: com.ioc.react-web
productName: IOC App
directories:
  output: release
  buildResources: build
icon: build/icon.ico
files:
  - dist/**/*
  - electron/**/*
publish:
  provider: github
  owner: libra-an
  repo: phan_quyen_ioc
  releaseType: release
win:
  target:
    - nsis
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: IOC App
